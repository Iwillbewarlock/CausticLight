; CausticLight - 물빛 설정 / water light settings
; 게임을 켠 채로 고쳐 저장해도 1~2초 안에 반영됩니다.
; Edit and save while the game runs: the changes apply within a second or two.

[Caustics]
; 반사광 세기: 물에 비친 빛이 벽과 천장을 얼마나 밝히는지. 2.14 = 물리 계산 그대로, 0 = 끔, 최대 50
; Reflected light strength on walls and ceilings. 2.14 = the physical amount, 0 = off, up to 50
fStrength = 6.4

; 물무늬 진하기: 0 = 무늬 없이 고른 빛, 1 = 물리 그대로, 2 = 두 배 진하게, 최대 3
; Ripple pattern contrast. 0 = an even glow, 1 = physical, 2 = twice as strong, up to 3
fRippleContrast = 1.0

; 물 밑바닥 무늬 세기 (위의 fStrength 에 곱해짐). 0 = 끔, 최대 5
; Pool floor pattern strength (on top of fStrength). 0 = off, up to 5
fFloorStrength = 1.0

[Distance]
; 1 = 물빛이 보이는 거리를 게임의 그림자 거리(fShadowDistance)에 맞춤, 0 = 아래 fMaxDistance 사용
; 1 = the caustics reach as far as the game's shadows (fShadowDistance), 0 = use fMaxDistance below
bFollowShadowDistance = 1
; 그림자 거리를 따르지 않을 때 물빛이 사라지는 거리 (게임 단위, 70 = 약 1 m)
; Where the caustics end when not following the shadows (game units, 70 = about 1 m)
fMaxDistance = 3000

[SurfaceTides]
; 1 = Surface Tides 모드가 있으면 실제 물 표면의 출렁임으로 무늬를 그림, 0 = 늘 미리 만든 무늬 사용
; 1 = with Surface Tides installed, draw the pattern from the real water surface, 0 = always the built-in pattern
bUseSurfaceTides = 1
